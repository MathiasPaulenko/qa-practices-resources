# pytest-xdist parallel configuration
# Requires: pip install pytest-xdist
# Usage:    pytest -c pytest_parallel.ini tests/

[pytest]
# 4 workers with grouped distribution: tests sharing a fixture
# stay on the same worker instead of splitting mid-setup.
# Replace 4 with the real core count of your CI runner.
addopts =
    -n 4
    --dist loadgroup
    --junitxml=reports/junit-{env:PYTEST_XDIST_WORKER:master}.xml
    -p no:randomly

markers =
    serial: tests that must not run in parallel (singleton resources,
        sequential behavior, license-limited APIs)
