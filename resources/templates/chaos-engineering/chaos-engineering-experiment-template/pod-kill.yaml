# pod-kill.yaml — terminates 30% of api-gateway pods for 1 minute
# Requires Chaos Mesh 2.7+ installed on the target cluster.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: ce-042-api-gateway-pod-kill
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: fixed-percent
  value: "30"
  duration: "1m"
  selector:
    namespaces:
      - staging
    labelSelectors:
      app: api-gateway
