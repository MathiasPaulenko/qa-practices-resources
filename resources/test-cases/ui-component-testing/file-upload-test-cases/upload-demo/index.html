<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DocDrop 2.3 — upload widget demo</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 24px auto; color: #1e293b; }
    #drop-zone {
      border: 2px dashed #94a3b8; border-radius: 8px; padding: 32px;
      text-align: center; cursor: pointer; background: #f8fafc;
    }
    #drop-zone.dragover { border-color: #2563eb; background: #eff6ff; }
    #drop-zone input { display: none; }
    ul#queue { list-style: none; padding: 0; margin-top: 16px; }
    li.queue-item { border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
    .meta { display: flex; justify-content: space-between; font-size: 13px; }
    progress { width: 100%; margin-top: 6px; }
    .error { color: #dc2626; font-size: 13px; margin-top: 4px; }
    .actions button { margin-right: 6px; font-size: 12px; padding: 3px 8px; }
  </style>
</head>
<body>
  <h1>DocDrop 2.3</h1>
  <p>Drag files here or <label for="file-input"><u>browse</u></label> — .pdf .png .jpg .docx, 10&nbsp;MB max.</p>
  <div id="drop-zone" data-testid="drop-zone">
    <span aria-hidden="true">Drop files here</span>
    <input id="file-input" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.docx" aria-label="Choose files">
  </div>
  <ul id="queue" aria-live="polite"></ul>
  <script src="upload.js"></script>
</body>
</html>
