# .github/workflows/cart-tests.yml
name: Cart & Wishlist Regression Tests
on: [push, pull_request]

jobs:
  playwright-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @playwright/test@1.48
      - run: npx playwright install --with-deps
      - run: npx playwright test tests/cart.spec.ts
        continue-on-error: true
      - run: npx playwright test tests/wishlist.spec.ts
        continue-on-error: true

  playwright-cross-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @playwright/test@1.48
      - run: npx playwright install --with-deps
      - run: npx playwright test tests/cross-device.spec.ts
        continue-on-error: true

  pytest-price-calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3 requests==2.32
      - run: pytest tests/test_price_calc.py -v
        continue-on-error: true
      - run: pytest tests/test_inventory.py -v
        continue-on-error: true
