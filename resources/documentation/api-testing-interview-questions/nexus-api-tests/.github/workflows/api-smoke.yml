name: Nexus API Smoke Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'nexus-api-tests/**'
      - 'postman/**'

jobs:
  newman-smoke:
    name: Postman Smoke (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman 6.1.2
        run: npm install -g newman@6.1.2 newman-reporter-junitfull@1.0.0

      - name: Run nexus-checkout-smoke
        working-directory: postman
        run: |
          newman run nexus-checkout-smoke.json \
            -e nexus-qa-env.json \
            --reporters cli,junitfull \
            --reporter-junitfull-export ../results/newman-results.xml

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Nexus API Smoke Results
          path: results/*.xml
          reporter: java-junit

  rest-assured-regression:
    name: REST Assured Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('nexus-api-tests/pom.xml') }}

      - name: Run smoke tests
        working-directory: nexus-api-tests
        run: mvn clean test -Denv=qa -Dbase.url=${{ secrets.QA_API_URL }}

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: nexus-api-tests/target/surefire-reports/
