name: qa-stack

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: app-under-test:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:qa@db:5432/testdb
    ports:
      - "8080:8080"
