# Deployment exercising all three probes + graceful shutdown + Pod Security.
# Verified on Kubernetes 1.29+ — kubectl apply -f pod-with-probes.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  labels:
    app: probe-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/started
              port: 8080
            failureThreshold: 30    # 30 x 5s = 150s boot budget
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]  # let the LB notice deregistration
          resources:
            requests:
              cpu: 100m             # required for CPU-based HPA
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
# Keeps 1 replica serving during voluntary disruptions (drain, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: probe-demo-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: probe-demo
