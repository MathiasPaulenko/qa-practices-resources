name: Test Pyramid Examples
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Jest
        run: npm install jest
      - name: Run unit tests
        run: npx jest src/calculateTotal.test.js

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytest
      - name: Verify API test files
        run: python -c "import requests; print('Import OK')"

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Playwright
        run: npm install @playwright/test
      - name: Verify e2e test syntax
        run: npx playwright test --list src/checkout.spec.js
