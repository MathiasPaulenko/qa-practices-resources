<!-- Bad: icon-only button with no accessible name -->
<button class="close"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="false"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2"/></svg></button>

<!-- Good: aria-label provides accessible name -->
<button class="close" aria-label="Close dialog">
  <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2"/></svg>
</button>

<!-- Bad: placeholder used as label -->
<input type="email" placeholder="Email address" />

<!-- Good: proper label element -->
<label for="email">Email address</label>
<input type="email" id="email" placeholder="example@domain.com" />

<!-- Visually hidden text for context-specific labels -->
<span class="sr-only" id="search-label">Search by keyword</span>
<button aria-labelledby="search-label">
  <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="2"/></svg>
</button>
