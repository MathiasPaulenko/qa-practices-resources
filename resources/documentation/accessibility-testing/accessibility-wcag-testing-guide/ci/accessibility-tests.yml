# GitHub Actions — accessibility gate scoped to critical pages
# and WCAG 2.2 A/AA. Drop into .github/workflows/.
name: accessibility-tests

on: [pull_request]

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Start server
        run: npm start &
      - name: Run axe-core on critical pages
        run: npx @axe-core/cli http://localhost:3000 http://localhost:3000/login http://localhost:3000/dashboard --exit
      - name: Run Lighthouse accessibility audit
        run: npx @lhci/cli@0.14 autorun
