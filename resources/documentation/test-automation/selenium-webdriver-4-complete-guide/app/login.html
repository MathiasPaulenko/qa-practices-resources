<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acme Store — Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; }
  input { display: block; width: 100%; margin: .5rem 0; padding: .5rem; }
  button { padding: .6rem 1.2rem; }
  #error-message { color: #b91c1c; min-height: 1.2rem; }
  #dashboard { display: none; }
  .spinner { display: none; }
</style>
</head>
<body>
  <h1>Sign in</h1>
  <div id="login-form">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn" data-testid="login-button" type="button">Log in</button>
    <p id="error-message"></p>
  </div>
  <div id="dashboard">
    <p data-testid="welcome-msg">Welcome back</p>
  </div>
  <div class="spinner" id="loading-spinner">Loading…</div>
  <button id="delayed-btn" type="button" style="display:none">Delayed action</button>
  <button id="open-tab" type="button" onclick="window.open('about:blank','_blank')">Open in new tab</button>
  <button id="confirm-btn" type="button" onclick="confirm('Delete item?')">Delete</button>
<script>
  const VALID_EMAIL = 'qa.tester@acme-store.io';
  const VALID_PASS = 'secretpassword';

  document.getElementById('login-btn').addEventListener('click', () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const err = document.getElementById('error-message');
    const spinner = document.getElementById('loading-spinner');
    err.textContent = '';
    spinner.style.display = 'block';
    setTimeout(() => {
      spinner.style.display = 'none';
      if (email === VALID_EMAIL && pass === VALID_PASS) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        history.pushState({}, '', '#dashboard');
      } else {
        err.textContent = 'Invalid credentials';
      }
    }, 300);
  });

  // delayed element for explicit-wait exercises
  setTimeout(() => {
    document.getElementById('delayed-btn').style.display = 'inline-block';
  }, 1200);
</script>
</body>
</html>
