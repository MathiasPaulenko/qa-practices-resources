# GitHub Actions example: run the tests and publish both report formats as artifacts.
name: test-reports

on: [push]

jobs:
  allure-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r allure/requirements.txt
      - run: cd allure && pytest --alluredir=allure-results
      - name: Generate Allure report
        if: always()
        run: cd allure && allure generate allure-results -o allure-report --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure/allure-report/

  extent-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cd extent && mvn -q test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-report
          path: extent/build/reports/
