<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Elements Fixture</title>
  <style>
    .hidden { display: none; }
    #spinner { color: #666; }
    #shadow-host { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Dynamic Elements Fixture</h1>

  <!-- Generated ID: changes suffix on every page load -->
  <button id="submit-btn" data-testid="save-button">Save</button>
  <script>
    document.getElementById('submit-btn').id = 'btn_' + Math.random().toString(36).slice(2, 8);
  </script>

  <!-- Delayed AJAX-style content -->
  <div id="spinner">Loading...</div>
  <ul id="results" class="hidden"></ul>
  <script>
    setTimeout(() => {
      document.getElementById('spinner').classList.add('hidden');
      const results = document.getElementById('results');
      for (let i = 1; i <= 5; i++) {
        const li = document.createElement('li');
        li.className = 'search-result';
        li.textContent = 'Result ' + i;
        results.appendChild(li);
      }
      results.classList.remove('hidden');
    }, 1200);
  </script>

  <!-- Custom dropdown (options appear after click) -->
  <button id="dropdown-trigger">Choose option</button>
  <div id="dropdown-menu" class="hidden">
    <div class="dropdown-option">Desired Option</div>
    <div class="dropdown-option">Other Option</div>
  </div>
  <script>
    document.getElementById('dropdown-trigger').addEventListener('click', () => {
      setTimeout(() => document.getElementById('dropdown-menu').classList.remove('hidden'), 600);
    });
  </script>

  <!-- Shadow DOM host -->
  <div id="shadow-host"></div>
  <script>
    const host = document.getElementById('shadow-host');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<button id="shadow-button">Shadow Button</button>';
  </script>

  <!-- Element that flips a class after load -->
  <div id="status" class="loading">pending</div>
  <script>
    setTimeout(() => {
      const s = document.getElementById('status');
      s.classList.remove('loading');
      s.classList.add('active');
      s.textContent = 'Ready';
    }, 800);
  </script>
</body>
</html>
