name: k6 v2 Load Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  k6:
    runs-on: [self-hosted, load-test]
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/payments.js
          flags: '--out influxdb=http://influxdb.novapay-sandbox:8086/k6db'
        env:
          BASE_URL: https://api.novapay.example.com/v2
          NOVA_API_KEY: ${{ secrets.NOVA_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: summary.html
