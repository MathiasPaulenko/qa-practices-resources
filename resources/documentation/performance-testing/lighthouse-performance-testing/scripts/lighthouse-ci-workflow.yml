# GitHub Actions workflow: Lighthouse CI on every push
# Requires: npm install -g @lhci/cli@0.14
name: Lighthouse CI
on: [push]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @lhci/cli@0.14
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        run: lhci autorun --config=scripts/lighthouserc.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
