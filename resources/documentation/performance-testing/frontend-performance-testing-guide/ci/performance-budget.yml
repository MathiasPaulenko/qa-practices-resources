# Lighthouse CI budget gate — copy to .github/workflows/performance-budget.yml
# Requires: preview/staging URLs listed in lighthouserc.json, Node 20+
name: performance-budget
on: [pull_request]
jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @lhci/cli@0.16
      - run: lhci autorun --config=ci/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
