# hpa.yaml — HorizontalPodAutoscaler, autoscaling/v2, Kubernetes 1.26+
# Scales checkout-api on CPU utilization plus a per-pod request-rate metric.
# The pods metric requires a metrics adapter (e.g. Prometheus Adapter).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "800"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
