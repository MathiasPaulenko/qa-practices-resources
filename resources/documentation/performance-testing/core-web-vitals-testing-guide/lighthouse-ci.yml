# GitHub Actions workflow — Lighthouse CI budget gate on every PR.
# Place it at .github/workflows/lighthouse-ci.yml in your project.
name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  cwv-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Lighthouse CI
        run: npm install -D @lhci/cli@0.16.0

      - name: Run Lighthouse CI budget assertions
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
