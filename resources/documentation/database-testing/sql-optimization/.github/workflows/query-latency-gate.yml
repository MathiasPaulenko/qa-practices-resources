name: query-latency-gate
on: [push]
jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - run: psql "$DATABASE_URL" -f sql/seed-orders.sql
      - run: chmod +x scripts/*.sh
      - run: ./scripts/benchmark.sh 20
      - run: psql "$DATABASE_URL" -f sql/indexes.sql
      - run: ./scripts/ci-query-gate.sh 200
