name: SQL Procedure Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: qa_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgtap
      - name: Load schema
        env:
          PGPASSWORD: qa
        run: |
          psql -h localhost -U postgres -d qa_staging -f schema/procedures.sql
      - name: Run pgTAP tests
        env:
          PGPASSWORD: qa
        run: |
          pg_prove -h localhost -U postgres -d qa_staging test/sql/*.sql
