# Prometheus alerting rules matching the P1-P4 severity matrix from the guide.
# Load with: rule_files: ["alert-rules.yml"] in prometheus.yml.
groups:
  - name: service-health
    rules:
      # P1 — page on-call immediately
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[2m]))
            / sum(rate(http_requests_total[2m])) > 0.10
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: "5xx error rate above 10% for 2 minutes"
          runbook: "https://runbooks.example.internal/high-error-rate"

      # P2 — page during business hours
      - alert: LatencyDegradation
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[10m])) by (le)
          ) > 0.5
        for: 15m
        labels:
          severity: P2
        annotations:
          summary: "P95 latency above 500ms sustained for 15 minutes"
          runbook: "https://runbooks.example.internal/latency-degradation"

      # P3 — ticket next business day
      - alert: DiskAlmostFull
        expr: |
          (node_filesystem_size_bytes{mountpoint="/var/lib/app"}
            - node_filesystem_free_bytes{mountpoint="/var/lib/app"})
            / node_filesystem_size_bytes{mountpoint="/var/lib/app"} > 0.80
        for: 30m
        labels:
          severity: P3
        annotations:
          summary: "Disk usage above 80% on app volume"

      # P4 — informational, weekly review
      - alert: ScrapeTargetFlapping
        expr: changes(up[1h]) > 4
        for: 0m
        labels:
          severity: P4
        annotations:
          summary: "Scrape target flapping — may indicate an unhealthy deployment"
