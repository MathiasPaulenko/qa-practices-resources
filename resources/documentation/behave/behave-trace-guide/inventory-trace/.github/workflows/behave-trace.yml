name: Behave Trace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install behave==1.3.3 behave-trace==1.3.1
      - run: behave --format behave-trace -o trace.json
        working-directory: inventory-trace
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behave-trace
          path: inventory-trace/trace.json
          retention-days: 3
