[project]
name = "shop-bdd"
version = "0.1.0"
description = "Behave BDD project that demonstrates reusable step definitions, custom parse types and per-scenario context reset."
requires-python = ">=3.11"
dependencies = [
    "behave==1.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
