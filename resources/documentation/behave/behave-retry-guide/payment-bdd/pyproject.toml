[project]
name = "payment-retry"
version = "0.1.0"
description = "Minimal Behave BDD project demonstrating behave-retry for flaky payment scenarios."
requires-python = ">=3.11"
dependencies = [
    "behave==1.3.3",
    "behave-retry==1.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
