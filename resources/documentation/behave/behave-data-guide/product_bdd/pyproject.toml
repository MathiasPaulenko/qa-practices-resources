[project]
name = "product-bdd-behave-data"
version = "1.0.0"
description = "Runnable Behave BDD project that demonstrates behave-data."
requires-python = ">=3.11"
dependencies = [
    "behave==1.3.3",
    "behave-data==1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
