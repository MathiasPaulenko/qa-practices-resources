name: behave-data suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  behave:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r product_bdd/requirements.txt
      - name: Set API key secret
        run: echo "CATALOG_API_KEY=test-key-ci" >> "$GITHUB_ENV"
      - name: Run Behave
        working-directory: product_bdd
        run: behave --no-capture --format json --outfile ../reports/behave-report.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-reports-${{ matrix.python-version }}
          path: reports/
