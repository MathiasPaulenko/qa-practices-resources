[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-pool-checkout-example"
version = "1.0.0"
description = "Runnable checkout example for behave-pool parallel execution."
requires-python = ">=3.11"
dependencies = [
    "behave>=1.3.0",
    "behave-pool>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]
