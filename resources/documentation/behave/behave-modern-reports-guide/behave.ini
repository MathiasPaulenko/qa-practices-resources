[behave]
paths = features

[behave.formatters]
modern-console = behave_modern_console_report.formatters.modern:ModernFormatter
markdown = behave_modern_md_report.formatter:BehaveMarkdownFormatter
modern-json = behave_modern_json_report.formatter:ModernJSONFormatter
modern-html = behave_modern_html_report.formatter:ModernHTMLFormatter
csv = behave_modern_sheets_report.csv_formatter:CSVFormatter
xlsx = behave_modern_sheets_report.xlsx_formatter:XLSXFormatter
modern-txt = behave_modern_file_report.txt_formatter:TXTFormatter
