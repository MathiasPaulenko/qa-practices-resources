name: Password Security Tests

on:
  push:
    paths:
      - 'resources/documentation/authentication/password-security-testing/**'
  pull_request:
    paths:
      - 'resources/documentation/authentication/password-security-testing/**'

jobs:
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/documentation/authentication/password-security-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Policy self-check
        run: node password_policy.js

  breach-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/documentation/authentication/password-security-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Breach check smoke test
        run: python breach_check.py "password123" || test $? -eq 1
