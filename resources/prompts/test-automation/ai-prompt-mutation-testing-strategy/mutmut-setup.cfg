; mutmut 3.x configuration — goes in setup.cfg next to the package.
; Run: mutmut run   then: mutmut results / mutmut show <id>
; Scope paths_to_mutate to the critical package; mutation runs multiply
; your test-suite runtime by the number of generated mutants.

[mutmut]
paths_to_mutate=src/payments/
tests_dir=tests/
runner=python -m pytest -x -q
do_not_mutate=
    */migrations/*
    */__init__.py
    */conftest.py
also_copy=
    tests/fixtures/
