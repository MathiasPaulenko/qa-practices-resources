<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QAPractices Resources</title>
  <meta name="description" content="Downloadable resources and runnable examples for qapractices.com">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e2e8f0;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 2rem 1rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    input, select, button {
      font: inherit;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
    }

    input[type="search"] {
      flex: 1 1 200px;
      min-width: 180px;
    }

    select { min-width: 140px; }

    button {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }

    .lang-toggle { margin-left: auto; }

    .stats {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      background: #e2e8f0;
      color: #475569;
    }

    .tag.type { background: #dbeafe; color: #1e40af; }
    .tag.topic { background: #dcfce7; color: #166534; }
    .tag.lang { background: #f1f5f9; color: #475569; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.75rem;
    }

    .links a {
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    .files {
      margin-top: 0.5rem;
    }

    .files summary {
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }

    .files ul {
      margin: 0.5rem 0 0;
      padding-left: 1.25rem;
      font-size: 0.85rem;
    }

    .files li { margin-bottom: 0.25rem; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>QAPractices Resources</h1>
    <p class="subtitle">Runnable examples, templates and downloads for qapractices.com</p>
    <a href="https://qapractices.com">Back to qapractices.com</a>
  </header>

  <main class="container">
    <div class="controls">
      <input type="search" id="search" placeholder="Search resources...">
      <select id="type-filter"><option value="">All types</option></select>
      <select id="topic-filter"><option value="">All topics</option></select>
      <select id="lang-filter"><option value="">All languages</option></select>
      <button id="clear">Clear</button>
      <button id="lang-toggle" class="lang-toggle">ES</button>
    </div>

    <div class="stats" id="stats">Loading resources...</div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    Generated from <a href="https://github.com/MathiasPaulenko/qa-practices-resources">MathiasPaulenko/qa-practices-resources</a>.
  </footer>

  <script>
    const grid = document.getElementById('grid');
    const stats = document.getElementById('stats');
    const searchInput = document.getElementById('search');
    const typeFilter = document.getElementById('type-filter');
    const topicFilter = document.getElementById('topic-filter');
    const langFilter = document.getElementById('lang-filter');
    const clearBtn = document.getElementById('clear');
    const langToggle = document.getElementById('lang-toggle');

    let catalog = { resources: [] };
    let lang = 'en';

    async function load() {
      try {
        const res = await fetch('./resources.json');
        if (!res.ok) throw new Error(res.statusText);
        catalog = await res.json();
        populateFilters();
        render();
      } catch (err) {
        stats.textContent = 'Could not load resources.json. Run `npm run build` first.';
        console.error(err);
      }
    }

    function populateFilters() {
      const types = new Set();
      const topics = new Set();
      const langs = new Set();

      for (const r of catalog.resources) {
        if (r.type) types.add(r.type);
        if (r.topic) topics.add(r.topic);
        if (r.language) langs.add(r.language);
      }

      fillSelect(typeFilter, types);
      fillSelect(topicFilter, topics);
      fillSelect(langFilter, langs);
    }

    function fillSelect(select, values) {
      const current = select.value;
      select.innerHTML = '<option value="">' + select.options[0].text + '</option>';
      for (const v of Array.from(values).sort()) {
        const option = document.createElement('option');
        option.value = v;
        option.textContent = v;
        select.appendChild(option);
      }
      select.value = current;
    }

    function t(resource, key) {
      return resource[`${key}_${lang}`] || resource[key];
    }

    function matches(resource) {
      const q = searchInput.value.toLowerCase();
      const type = typeFilter.value;
      const topic = topicFilter.value;
      const language = langFilter.value;

      if (type && resource.type !== type) return false;
      if (topic && resource.topic !== topic) return false;
      if (language && resource.language !== language) return false;

      if (q) {
        const haystack = [
          t(resource, 'title'),
          t(resource, 'description'),
          resource.type,
          resource.topic,
          resource.slug,
          ...(resource.tags || []),
        ].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }

      return true;
    }

    function render() {
      const filtered = catalog.resources.filter(matches);
      stats.textContent = `Showing ${filtered.length} of ${catalog.resources.length} resources`;
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No resources match your filters.</div>';
        return;
      }

      for (const r of filtered) {
        const card = document.createElement('article');
        card.className = 'card';

        const title = document.createElement('h2');
        title.textContent = t(r, 'title');

        const desc = document.createElement('p');
        desc.textContent = t(r, 'description');

        const tags = document.createElement('div');
        tags.className = 'tags';
        tags.innerHTML = `
          <span class="tag type">${r.type}</span>
          <span class="tag topic">${r.topic}</span>
          ${r.language ? `<span class="tag lang">${r.language}</span>` : ''}
        `;

        const links = document.createElement('div');
        links.className = 'links';

        if (r.github_url) {
          links.innerHTML += `<a href="${r.github_url}" target="_blank" rel="noopener">View on GitHub</a>`;
        }

        if (r.source_urls && r.source_urls.length) {
          for (const url of r.source_urls) {
            const label = url.includes('/es/') ? 'Open in QAPractices (ES)' : 'Open in QAPractices';
            links.innerHTML += `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
          }
        }

        const files = document.createElement('details');
        files.className = 'files';
        if (r.files && r.files.length) {
          files.innerHTML = `<summary>${r.files.length} file${r.files.length > 1 ? 's' : ''}</summary><ul>` +
            r.files.map(f => `<li><a href="${f.raw_url}" target="_blank" rel="noopener">${f.name}</a></li>`).join('') +
            '</ul>';
        } else {
          files.innerHTML = '<summary>No files listed</summary>';
        }

        card.append(title, desc, tags, links, files);
        grid.appendChild(card);
      }
    }

    function setLanguage() {
      lang = lang === 'en' ? 'es' : 'en';
      langToggle.textContent = lang === 'en' ? 'ES' : 'EN';
      render();
    }

    searchInput.addEventListener('input', render);
    typeFilter.addEventListener('change', render);
    topicFilter.addEventListener('change', render);
    langFilter.addEventListener('change', render);
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      typeFilter.value = '';
      topicFilter.value = '';
      langFilter.value = '';
      render();
    });
    langToggle.addEventListener('click', setLanguage);

    load();
  </script>
</body>
</html>
